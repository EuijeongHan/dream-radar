<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="1080" height="1350" fill="#F4F0E7"/><text x="72" y="72" font-size="25" font-weight="700" fill="#173B32">FROM HAEWON · PAPER RADAR 001</text><line x1="72" y1="104" x2="1008" y2="104" stroke="#173B32" stroke-width="2"/><text x="72" y="160" font-size="28" font-weight="700" fill="#DE5135">02 / 논문의 해결법</text><text x="72" y="265" font-size="66" font-weight="800" fill="#173B32">게임의 저장 지점을</text><text x="72" y="350.8" font-size="66" font-weight="800" fill="#173B32">AI 작업에도.</text><text x="72" y="480" font-size="34" font-weight="500" fill="#173B32">AgentRewind는 대화 맥락과 통제된 환경을</text><text x="72" y="529.3" font-size="34" font-weight="500" fill="#173B32">같은 시점의 체크포인트로 기록합니다.</text><rect x="72" y="620" width="936" height="239" rx="20" fill="#E6E7DD"/><text x="105" y="685" font-size="36" font-weight="500" fill="#173B32">① 같은 시점에 저장</text><text x="105" y="737.2" font-size="36" font-weight="500" fill="#173B32">② 오류가 생기면 이전 상태로 복귀</text><text x="105" y="789.4" font-size="36" font-weight="500" fill="#173B32">③ 앞선 시도의 정보를 활용해 재개</text><text x="72" y="1110" font-size="25" font-weight="500" fill="#173B32">원리 비유: 게임 저장 지점</text><text x="72" y="1150" font-size="25" font-weight="500" fill="#173B32">모든 외부 행동을 되돌릴 수 있다는 뜻은 아닙니다.</text><text x="72" y="1290" font-size="24" font-weight="500" fill="#173B32">한해원의 관측소</text><text x="900" y="1290" font-size="24" font-weight="500" fill="#173B32">03 / 05</text></g></svg>