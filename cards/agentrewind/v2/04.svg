<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="1080" height="1350" fill="#F4F0E7"/><text x="72" y="72" font-size="25" font-weight="700" fill="#173B32">FROM HAEWON · PAPER RADAR 001</text><line x1="72" y1="104" x2="1008" y2="104" stroke="#173B32" stroke-width="2"/><text x="72" y="160" font-size="28" font-weight="700" fill="#DE5135">03 / 어디까지 확인됐나</text><text x="72" y="265" font-size="66" font-weight="800" fill="#173B32">성공 여부와</text><text x="72" y="350.8" font-size="66" font-weight="800" fill="#173B32">중간 진척도를 본다.</text><text x="72" y="480" font-size="34" font-weight="500" fill="#173B32">연구진은 장기 엔지니어링 과제를 위한</text><text x="72" y="529.3" font-size="34" font-weight="500" fill="#173B32">MettleBench도 제안했습니다.</text><rect x="72" y="620" width="936" height="239" rx="20" fill="#E6E7DD"/><text x="105" y="685" font-size="36" font-weight="500" fill="#173B32">초록에서 보고한 결과</text><text x="105" y="737.2" font-size="36" font-weight="500" fill="#173B32">비교 기준보다 작업 성공률 개선</text><text x="105" y="789.4" font-size="36" font-weight="500" fill="#173B32">평균 체크리스트 진척도 개선</text><text x="72" y="1110" font-size="25" font-weight="500" fill="#173B32">읽을 때 주의할 점</text><text x="72" y="1150" font-size="25" font-weight="500" fill="#173B32">개선 폭과 세부 조건은 이번 요약에서 검증하지 않았습니다.</text><text x="72" y="1290" font-size="24" font-weight="500" fill="#173B32">한해원의 관측소</text><text x="900" y="1290" font-size="24" font-weight="500" fill="#173B32">04 / 05</text></g></svg>