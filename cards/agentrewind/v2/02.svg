<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="1080" height="1350" fill="#F4F0E7"/><text x="72" y="72" font-size="25" font-weight="700" fill="#173B32">FROM HAEWON · PAPER RADAR 001</text><line x1="72" y1="104" x2="1008" y2="104" stroke="#173B32" stroke-width="2"/><text x="72" y="160" font-size="28" font-weight="700" fill="#DE5135">01 / 왜 “다시 해”로 부족할까</text><text x="72" y="265" font-size="66" font-weight="800" fill="#173B32">대화만 고쳐도</text><text x="72" y="350.8" font-size="66" font-weight="800" fill="#173B32">바뀐 파일은 남는다.</text><text x="72" y="480" font-size="34" font-weight="500" fill="#173B32">긴 작업의 오류는 대화 기록과</text><text x="72" y="529.3" font-size="34" font-weight="500" fill="#173B32">환경 상태 양쪽으로 퍼질 수 있습니다.</text><rect x="72" y="620" width="936" height="239" rx="20" fill="#E6E7DD"/><text x="105" y="685" font-size="36" font-weight="500" fill="#173B32">이해를 돕는 예시</text><text x="105" y="737.2" font-size="36" font-weight="500" fill="#173B32">잘못 수정한 파일 위에서 계속 작업하면</text><text x="105" y="789.4" font-size="36" font-weight="500" fill="#173B32">다음 단계도 틀어질 수 있습니다.</text><text x="72" y="1110" font-size="25" font-weight="500" fill="#173B32">핵심 질문</text><text x="72" y="1150" font-size="25" font-weight="500" fill="#173B32">AI의 생각과 작업장을 함께 복구할 수 있을까?</text><text x="72" y="1290" font-size="24" font-weight="500" fill="#173B32">한해원의 관측소</text><text x="900" y="1290" font-size="24" font-weight="500" fill="#173B32">02 / 05</text></g></svg>