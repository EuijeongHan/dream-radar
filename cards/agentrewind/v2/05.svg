<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="1080" height="1350" fill="#F4F0E7"/><text x="72" y="72" font-size="25" font-weight="700" fill="#173B32">FROM HAEWON · PAPER RADAR 001</text><line x1="72" y1="104" x2="1008" y2="104" stroke="#173B32" stroke-width="2"/><text x="72" y="160" font-size="28" font-weight="700" fill="#DE5135">04 / 저장해두고 해볼 실험</text><text x="72" y="265" font-size="57" font-weight="800" fill="#173B32">실패를 한 번</text><text x="72" y="339.1" font-size="57" font-weight="800" fill="#173B32">일부러 넣어보세요.</text><text x="72" y="445" font-size="34" font-weight="500" fill="#173B32">관측소의 적용 아이디어 · 논문 실험과 별개</text><rect x="72" y="510" width="936" height="239" rx="20" fill="#E6E7DD"/><text x="105" y="575" font-size="36" font-weight="500" fill="#173B32">테스트용 작업에서 중간 실패를 만들고,</text><text x="105" y="627.2" font-size="36" font-weight="500" fill="#173B32">처음부터 재실행 vs 저장 지점부터 재개를 비교.</text><text x="105" y="679.4" font-size="36" font-weight="500" fill="#173B32">완료 여부 · 소요 시간 · 중복 작업을 기록하세요.</text><line x1="72" y1="795" x2="1008" y2="795" stroke="#173B32"/><text x="72" y="843" font-size="29" font-weight="700" fill="#173B32">AgentRewind: Recoverable Execution</text><text x="72" y="885.05" font-size="29" font-weight="700" fill="#173B32">for Long-Horizon LLM Agents</text><text x="72" y="940" font-size="24" font-weight="500" fill="#173B32">Yu Zhuang · Kefei Chen · Yitong Duan</text><text x="72" y="974.8" font-size="24" font-weight="500" fill="#173B32">Shuxin Zheng · Jian Li · Xu-Yao Zhang</text><text x="72" y="1030" font-size="24" font-weight="500" fill="#173B32">https://arxiv.org/abs/2608.14380</text><text x="72" y="1064.8" font-size="24" font-weight="500" fill="#173B32">논문 초록 기반 요약 · 실험 수치 미검증</text><text x="72" y="1150" font-size="22" font-weight="500" fill="#173B32">© fromhaewon. All rights reserved.</text><text x="72" y="1181.9" font-size="22" font-weight="500" fill="#173B32">권리 표기는 직접 작성한 요약·디자인에 한정됩니다.</text><text x="72" y="1290" font-size="24" font-weight="500" fill="#173B32">한해원의 관측소</text><text x="900" y="1290" font-size="24" font-weight="500" fill="#173B32">05 / 05</text></g></svg>