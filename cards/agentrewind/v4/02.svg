</defs><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F7F8FA"/><text x="64" y="65" font-size="24" font-weight="700" fill="#101114">FROM HAEWON  /  PAPER RADAR 001</text><path d="M64 94 L1016 94" stroke="#10111433" stroke-width="2" fill="none"/><text x="64" y="1295" font-size="24" font-weight="600" fill="#101114">한해원의 관측소</text><text x="945" y="1295" font-size="24" font-weight="600" fill="#101114">2 / 5</text><text x="64" y="205" font-size="70" font-weight="900" fill="#101114">문제는 두 곳에 남는다</text><text x="64" y="276" font-size="33" font-weight="600" fill="#101114">“다시 해”라고 말해도, 파일은 이미 바뀌었다면?</text><rect x="64" y="385" width="448" height="480" rx="30" fill="#E5E9FF"/><rect x="536" y="385" width="480" height="480" rx="30" fill="#FFE2DB"/><g transform="translate(150 450)" filter="url(#shadow)"><path d="M30 -28 L30 0" stroke="#ADB9D8" stroke-width="12" fill="none"/><path d="M30 260 L30 288" stroke="#6F7D9F" stroke-width="12" fill="none"/><path d="M-28 30 L0 30" stroke="#ADB9D8" stroke-width="12" fill="none"/><path d="M260 30 L288 30" stroke="#6F7D9F" stroke-width="12" fill="none"/><path d="M78 -28 L78 0" stroke="#ADB9D8" stroke-width="12" fill="none"/><path d="M78 260 L78 288" stroke="#6F7D9F" stroke-width="12" fill="none"/><path d="M-28 78 L0 78" stroke="#ADB9D8" stroke-width="12" fill="none"/><path d="M260 78 L288 78" stroke="#6F7D9F" stroke-width="12" fill="none"/><path d="M126 -28 L126 0" stroke="#ADB9D8" stroke-width="12" fill="none"/><path d="M126 260 L126 288" stroke="#6F7D9F" stroke-width="12" fill="none"/><path d="M-28 126 L0 126" stroke="#ADB9D8" stroke-width="12" fill="none"/><path d="M260 126 L288 126" stroke="#6F7D9F" stroke-width="12" fill="none"/><path d="M174 -28 L174 0" stroke="#ADB9D8" stroke-width="12" fill="none"/><path d="M174 260 L174 288" stroke="#6F7D9F" stroke-width="12" fill="none"/><path d="M-28 174 L0 174" stroke="#ADB9D8" stroke-width="12" fill="none"/><path d="M260 174 L288 1