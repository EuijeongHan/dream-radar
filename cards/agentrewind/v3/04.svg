<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F7F8FA"/><text x="64" y="65" font-size="24" font-weight="700" fill="#101114">FROM HAEWON  /  PAPER RADAR 001</text><path d="M64 94 L1016 94" stroke="#10111433" stroke-width="2" fill="none"/><text x="64" y="1295" font-size="24" font-weight="600" fill="#101114">한해원의 관측소</text><text x="945" y="1295" font-size="24" font-weight="600" fill="#101114">4 / 5</text><text x="64" y="210" font-size="74" font-weight="900" fill="#101114">성공만 세지 않는다.</text><text x="64" y="283" font-size="32" font-weight="600" fill="#101114">MettleBench는 장기 과제의 부분 진척도도 봅니다.</text><rect x="64" y="385" width="952" height="120" rx="20" fill="#E4E9FF"/><circle cx="124" cy="445" r="28" fill="#3455FF"/><text x="104" y="458" font-size="35" font-weight="600" fill="#F7F8FA">✓</text><text x="185" y="458" font-size="38" font-weight="600" fill="#101114">요구사항 A 완료</text><rect x="64" y="540" width="952" height="120" rx="20" fill="#E4E9FF"/><circle cx="124" cy="600" r="28" fill="#3455FF"/><text x="104" y="613" font-size="35" font-weight="600" fill="#F7F8FA">✓</text><text x="185" y="613" font-size="38" font-weight="600" fill="#101114">요구사항 B 완료</text><rect x="64" y="695" width="952" height="120" rx="20" fill="#EAECF0"/><circle cx="124" cy="755" r="28" fill="#C6CBD4"/><text x="104" y="768" font-size="35" font-weight="600" fill="#F7F8FA">…</text><text x="185" y="768" font-size="38" font-weight="600" fill="#101114">요구사항 C 진행 중</text><rect x="64" y="932" width="952" height="255" rx="24" fill="#101114"/><text x="96" y="985" font-size="28" font-weight="600" fill="#9AA9FF">초록에서 보고한 결과</text><text x="96" y="1045" font-size="38" font-weight="800" fill="#F7F8FA">성공률과 평균 체크리스트 진척도 개선</text><text x="96" y="1106" font-size="28" font-weight="500" fill="#F7F8FA">비교 기준 대비 개선. 수치·세부 실험 조건은</text><text x="96" y="1148" font-size="28" font-weight="500" fill="#F7F8FA">이번 초록 기반 요약에서 검증하지 않았습니다.</text></g></svg>