<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#101114"/><text x="64" y="65" font-size="24" font-weight="700" fill="#F7F8FA">FROM HAEWON  /  PAPER RADAR 001</text><path d="M64 94 L1016 94" stroke="#ffffff44" stroke-width="2" fill="none"/><text x="64" y="1295" font-size="24" font-weight="600" fill="#F7F8FA">한해원의 관측소</text><text x="945" y="1295" font-size="24" font-weight="600" fill="#F7F8FA">3 / 5</text><text x="64" y="205" font-size="66" font-weight="900" fill="#F7F8FA">게임처럼, 저장 지점으로.</text><text x="64" y="275" font-size="34" font-weight="600" fill="#9AA9FF">같은 시점의 대화 + 통제된 환경을 기록</text><path d="M160 560 L915 560" stroke="#4D5366" stroke-width="12" fill="none"/><circle cx="160" cy="560" r="37" fill="#3455FF"/><text x="112" y="650" font-size="32" font-weight="600" fill="#F7F8FA">시작</text><circle cx="410" cy="560" r="37" fill="#3455FF"/><text x="362" y="650" font-size="32" font-weight="600" fill="#F7F8FA">저장</text><circle cx="660" cy="560" r="37" fill="#3455FF"/><text x="612" y="650" font-size="32" font-weight="600" fill="#F7F8FA">작업</text><circle cx="910" cy="560" r="37" fill="#FF613B"/><text x="862" y="650" font-size="32" font-weight="600" fill="#F7F8FA">오류</text><path d="M910 735 Q910 940 410 940 L410 750" fill="none" stroke="#9AA9FF" stroke-width="15"/><path d="M385 780 L410 740 L435 780" fill="none" stroke="#9AA9FF" stroke-width="12"/><text x="490" y="870" font-size="62" font-weight="900" fill="#9AA9FF">REWIND</text><text x="64" y="1060" font-size="40" font-weight="600" fill="#F7F8FA">이전 상태로 돌아가</text><text x="64" y="1110" font-size="40" font-weight="600" fill="#F7F8FA">앞선 시도의 정보를 활용해 재개합니다.</text><text x="64" y="1195" font-size="25" font-weight="600" fill="#B8BDC9">복구 범위: 통제된 환경 · 모든 외부 행동을 되돌린다는 뜻은 아님</text></g></svg>