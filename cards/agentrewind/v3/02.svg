<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F7F8FA"/><text x="64" y="65" font-size="24" font-weight="700" fill="#101114">FROM HAEWON  /  PAPER RADAR 001</text><path d="M64 94 L1016 94" stroke="#10111433" stroke-width="2" fill="none"/><text x="64" y="1295" font-size="24" font-weight="600" fill="#101114">한해원의 관측소</text><text x="945" y="1295" font-size="24" font-weight="600" fill="#101114">2 / 5</text><text x="64" y="205" font-size="70" font-weight="900" fill="#101114">문제는 두 곳에 남는다</text><text x="64" y="276" font-size="33" font-weight="600" fill="#101114">“다시 해”라고 말해도, 파일은 이미 바뀌었다면?</text><rect x="64" y="385" width="448" height="480" rx="30" fill="#E5E9FF"/><rect x="536" y="385" width="480" height="480" rx="30" fill="#FFE2DB"/><g transform="translate(150 450)"><rect x="0" y="0" width="260" height="260" rx="45" fill="#3455FF"/><path d="M30 -28 L30 0" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M30 260 L30 288" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M-28 30 L0 30" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M260 30 L288 30" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M78 -28 L78 0" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M78 260 L78 288" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M-28 78 L0 78" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M260 78 L288 78" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M126 -28 L126 0" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M126 260 L126 288" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M-28 126 L0 126" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M260 126 L288 126" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M174 -28 L174 0" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M174 260 L174 288" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M-28 174 L0 174" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M260 174 L288 174" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M222 -28 L222 0" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M222 260 L222 288" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M-28 222 L0 222" stroke="#3455FF" stroke-width="12" fill="none"/><path d="M260 222 L288 222" stroke="#3455FF" stroke-width="12" fill="none"/><rect x="40" y="40" width="180" height="180" rx="22" fill="#101114"/><text x="75" y="162" font-size="68" font-weight="800" fill="#F7F8FA">AI</text></g><g transform="translate(660 475) rotate(-6)"><rect x="0" y="0" width="220" height="260" rx="18" fill="#FF613B"/><rect x="25" y="55" width="170" height="12" rx="6" fill="#ffffff77"/><rect x="25" y="92" width="125" height="12" rx="6" fill="#ffffff77"/><rect x="25" y="130" width="150" height="12" rx="6" fill="#ffffff77"/><text x="25" y="225" font-size="28" font-weight="600" fill="#F7F8FA">FILE</text></g><text x="95" y="820" font-size="36" font-weight="800" fill="#3455FF">대화 맥락의 오류</text><text x="565" y="820" font-size="36" font-weight="800" fill="#FF613B">작업 환경의 오류</text><path d="M460 980 L625 980" stroke="#101114" stroke-width="7" fill="none"/><path d="M610 965 L625 980 L610 995" stroke="#101114" fill="none" stroke-width="7"/><text x="135" y="995" font-size="45" font-weight="600" fill="#101114">오류</text><text x="650" y="995" font-size="36" font-weight="600" fill="#101114">다음 단계로 전파</text><text x="64" y="1150" font-size="29" font-weight="500" fill="#101114">긴 작업에서는 초기 실수가 두 상태에 함께 남을 수 있다.</text><text x="64" y="1196.4" font-size="29" font-weight="500" fill="#101114">그림은 원리 설명용 예시이며 논문 도표가 아닙니다.</text></g></svg>