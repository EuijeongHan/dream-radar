<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="1080" height="1350" fill="#F4F0E7"/><text x="72" y="72" font-size="25" font-weight="700" fill="#173B32">FROM HAEWON · PAPER RADAR 002</text><line x1="72" y1="104" x2="1008" y2="104" stroke="#173B32" stroke-width="2"/><text x="72" y="160" font-size="28" font-weight="700" fill="#DE5135">03 / 숫자는 조건과 함께</text><text x="72" y="265" font-size="66" font-weight="800" fill="#173B32">기억 속 거짓 권한,</text><text x="72" y="350.8" font-size="66" font-weight="800" fill="#173B32">행동으로 이어졌다.</text><text x="72" y="480" font-size="34" font-weight="500" fill="#173B32">증분 기억 갱신 조건에서 관측한 결과</text><rect x="72" y="600" width="936" height="181" rx="20" fill="#173B32"/><text x="105" y="665" font-size="36" font-weight="500" fill="#F4F0E7">최대 50.2%</text><text x="105" y="717.2" font-size="36" font-weight="500" fill="#F4F0E7">무권한 요청에 거짓 권한을 만든 비율</text><rect x="72" y="820" width="936" height="181" rx="20" fill="#E6E7DD"/><text x="105" y="885" font-size="36" font-weight="500" fill="#173B32">98.6%</text><text x="105" y="937.2" font-size="36" font-weight="500" fill="#173B32">거짓 권한이 이미 있을 때 실행한 비율</text><text x="72" y="1110" font-size="25" font-weight="500" fill="#173B32">한계</text><text x="72" y="1150" font-size="25" font-weight="500" fill="#173B32">모델·기억 구성에 따라 다르며 실서비스 전체의 확률이 아닙니다.</text><text x="72" y="1290" font-size="24" font-weight="500" fill="#173B32">한해원의 관측소</text><text x="900" y="1290" font-size="24" font-weight="500" fill="#173B32">04 / 05</text></g></svg>