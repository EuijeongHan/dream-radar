<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="1080" height="1350" fill="#F4F0E7"/><text x="72" y="72" font-size="25" font-weight="700" fill="#173B32">FROM HAEWON · PAPER RADAR 002</text><line x1="72" y1="104" x2="1008" y2="104" stroke="#173B32" stroke-width="2"/><text x="72" y="160" font-size="28" font-weight="700" fill="#DE5135">02 / 기억 오류가 행동으로 이어질까</text><text x="72" y="265" font-size="66" font-weight="800" fill="#173B32">기억하는 AI와</text><text x="72" y="350.8" font-size="66" font-weight="800" fill="#173B32">실행하는 AI를 나눴다.</text><text x="72" y="480" font-size="34" font-weight="500" fill="#173B32">구매 · 사이버보안 · 금융 영역에서</text><text x="72" y="529.3" font-size="34" font-weight="500" fill="#173B32">기억 작성 모델 5개, 실행 모델 2개를 평가했습니다.</text><rect x="72" y="620" width="936" height="239" rx="20" fill="#E6E7DD"/><text x="105" y="685" font-size="36" font-weight="500" fill="#173B32">권한 변경 이력</text><text x="105" y="737.2" font-size="36" font-weight="500" fill="#173B32">↓ 지속 기억으로 정리</text><text x="105" y="789.4" font-size="36" font-weight="500" fill="#173B32">↓ 그 기억을 보고 실행 여부 판단</text><text x="72" y="1110" font-size="25" font-weight="500" fill="#173B32">검사하는 두 지점</text><text x="72" y="1150" font-size="25" font-weight="500" fill="#173B32">거짓 권한이 생겼나? → 무권한 행동으로 이어졌나?</text><text x="72" y="1290" font-size="24" font-weight="500" fill="#173B32">한해원의 관측소</text><text x="900" y="1290" font-size="24" font-weight="500" fill="#173B32">03 / 05</text></g></svg>