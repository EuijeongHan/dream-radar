<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="1080" height="1350" fill="#F4F0E7"/><text x="72" y="72" font-size="25" font-weight="700" fill="#173B32">FROM HAEWON · PAPER RADAR 002</text><line x1="72" y1="104" x2="1008" y2="104" stroke="#173B32" stroke-width="2"/><text x="72" y="160" font-size="28" font-weight="700" fill="#DE5135">01 / 권한은 계속 바뀐다</text><text x="72" y="265" font-size="66" font-weight="800" fill="#173B32">허용 → 범위 축소</text><text x="72" y="350.8" font-size="66" font-weight="800" fill="#173B32">→ 마지막엔 철회.</text><text x="72" y="480" font-size="34" font-weight="500" fill="#173B32">기억을 압축하며 변경 기록을 놓치면</text><text x="72" y="529.3" font-size="34" font-weight="500" fill="#173B32">과거의 허용이 현재 권한처럼 남을 수 있습니다.</text><rect x="72" y="620" width="936" height="239" rx="20" fill="#E6E7DD"/><text x="105" y="685" font-size="36" font-weight="500" fill="#173B32">이해를 돕는 예시</text><text x="105" y="737.2" font-size="36" font-weight="500" fill="#173B32">“구매해도 돼” → “이번 구매는 취소해”</text><text x="105" y="789.4" font-size="36" font-weight="500" fill="#173B32">요약에 첫 문장만 남는다면?</text><text x="72" y="1110" font-size="25" font-weight="500" fill="#173B32">논문이 다루는 실패</text><text x="72" y="1150" font-size="25" font-weight="500" fill="#173B32">외부 공격 없이 기억 갱신 자체에서 생기는 권한 왜곡</text><text x="72" y="1290" font-size="24" font-weight="500" fill="#173B32">한해원의 관측소</text><text x="900" y="1290" font-size="24" font-weight="500" fill="#173B32">02 / 05</text></g></svg>