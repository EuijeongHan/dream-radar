<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="1080" height="1350" fill="#F4F0E7"/><text x="72" y="72" font-size="25" font-weight="700" fill="#173B32">FROM HAEWON · PAPER RADAR 002</text><line x1="72" y1="104" x2="1008" y2="104" stroke="#173B32" stroke-width="2"/><text x="72" y="160" font-size="28" font-weight="700" fill="#DE5135">논문 한 편, 5장으로 읽기</text><text x="72" y="265" font-size="66" font-weight="800" fill="#173B32">“허락한 적 없는데”</text><text x="72" y="350.8" font-size="66" font-weight="800" fill="#173B32">AI는 왜</text><text x="72" y="436.6" font-size="66" font-weight="800" fill="#173B32">실행했을까?</text><text x="72" y="575" font-size="34" font-weight="500" fill="#173B32">기억을 요약하다 권한까지 바뀌는 문제.</text><text x="72" y="624.3" font-size="34" font-weight="500" fill="#173B32">EAL-Bench 논문으로 읽습니다.</text><rect x="72" y="740" width="936" height="181" rx="20" fill="#173B32"/><text x="105" y="805" font-size="36" font-weight="500" fill="#F4F0E7">과거의 허용 ≠ 지금의 허용</text><text x="105" y="857.2" font-size="36" font-weight="500" fill="#F4F0E7">기억에 남은 권한을 믿어도 될까?</text><text x="72" y="1050" font-size="28" font-weight="700" fill="#DE5135">승인받고 실행하는 AI를 만드는 사람에게</text><text x="72" y="1120" font-size="25" font-weight="600" fill="#173B32">Agent Memory Is a Surface for</text><text x="72" y="1156.25" font-size="25" font-weight="600" fill="#173B32">Endogenous Authorization Laundering</text><text x="72" y="1290" font-size="24" font-weight="500" fill="#173B32">한해원의 관측소</text><text x="900" y="1290" font-size="24" font-weight="500" fill="#173B32">01 / 05</text></g></svg>