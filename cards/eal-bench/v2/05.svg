<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="1080" height="1350" fill="#F4F0E7"/><text x="72" y="72" font-size="25" font-weight="700" fill="#173B32">FROM HAEWON · PAPER RADAR 002</text><line x1="72" y1="104" x2="1008" y2="104" stroke="#173B32" stroke-width="2"/><text x="72" y="160" font-size="28" font-weight="700" fill="#DE5135">04 / 저장해두고 해볼 실험</text><text x="72" y="265" font-size="57" font-weight="800" fill="#173B32">승인을 취소한 뒤,</text><text x="72" y="339.1" font-size="57" font-weight="800" fill="#173B32">AI를 다시 실행해보세요.</text><text x="72" y="445" font-size="34" font-weight="500" fill="#173B32">관측소의 적용 아이디어 · 격리된 테스트 환경에서</text><rect x="72" y="510" width="936" height="239" rx="20" fill="#E6E7DD"/><text x="105" y="575" font-size="36" font-weight="500" fill="#173B32">승인 → 철회 → 실행 요청 순서로 테스트.</text><text x="105" y="627.2" font-size="36" font-weight="500" fill="#173B32">기억과 별도로 권한 원장을 두고 실행 직전 확인.</text><text x="105" y="679.4" font-size="36" font-weight="500" fill="#173B32">잘못 허용한 경우와 잘못 거부한 경우를 함께 기록.</text><line x1="72" y1="795" x2="1008" y2="795" stroke="#173B32"/><text x="72" y="843" font-size="29" font-weight="700" fill="#173B32">Agent Memory Is a Surface for</text><text x="72" y="885.05" font-size="29" font-weight="700" fill="#173B32">Endogenous Authorization Laundering</text><text x="72" y="940" font-size="24" font-weight="500" fill="#173B32">Tommaso Cerruti · Mika Okamoto</text><text x="72" y="974.8" font-size="24" font-weight="500" fill="#173B32">Ansel Kaplan Erol</text><text x="72" y="1030" font-size="24" font-weight="500" fill="#173B32">https://arxiv.org/abs/2609.01836</text><text x="72" y="1064.8" font-size="24" font-weight="500" fill="#173B32">논문 본문 기반 요약 · 결과는 벤치마크 조건에 한정</text><text x="72" y="1150" font-size="22" font-weight="500" fill="#173B32">© fromhaewon. All rights reserved.</text><text x="72" y="1181.9" font-size="22" font-weight="500" fill="#173B32">권리 표기는 직접 작성한 요약·디자인에 한정됩니다.</text><text x="72" y="1290" font-size="24" font-weight="500" fill="#173B32">한해원의 관측소</text><text x="900" y="1290" font-size="24" font-weight="500" fill="#173B32">05 / 05</text></g></svg>