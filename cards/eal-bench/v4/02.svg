</defs><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F7F8FA"/><text x="64" y="65" font-size="24" font-weight="700" fill="#101114">FROM HAEWON  /  PAPER RADAR 002</text><path d="M64 94 L1016 94" stroke="#10111433" stroke-width="2" fill="none"/><text x="64" y="1295" font-size="24" font-weight="600" fill="#101114">한해원의 관측소</text><text x="945" y="1295" font-size="24" font-weight="600" fill="#101114">2 / 5</text><text x="64" y="205" font-size="75" font-weight="900" fill="#101114">취소했는데,</text><text x="64" y="298.75" font-size="75" font-weight="900" fill="#101114">기억에는 “허용”.</text><rect x="64" y="390" width="710" height="112" rx="25" fill="#E8EAF0"/><text x="95" y="460" font-size="35" font-weight="600" fill="#101114">사용자  “구매해도 돼”</text><rect x="305" y="540" width="711" height="112" rx="25" fill="#FFE1D8"/><text x="335" y="610" font-size="35" font-weight="600" fill="#101114">사용자  “이번 구매는 취소해”</text><path d="M540 690 V810" stroke="#101114" stroke-width="6"/><path d="M520 785 L540 810 L560 785" stroke="#101114" fill="none" stroke-width="6"/><rect x="150" y="850" width="780" height="180" rx="25" fill="#101114"/><text x="186" y="905" font-size="29" font-weight="600" fill="#B8BDC9">압축된 기억</text><text x="186" y="978" font-size="52" font-weight="900" fill="#FF613B">“구매 권한 있음”</text><text x="64" y="1145" font-size="29" font-weight="500" fill="#101114">철회·범위를 놓친 요약이 과거 권한을 살릴 수 있다.</text><text x="64" y="1191.4" font-size="29" font-weight="500" fill="#101114">구매 대화는 이해를 돕기 위한 예시입니다.</text></g></svg>