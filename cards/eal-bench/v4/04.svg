</defs><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F7F8FA"/><text x="64" y="65" font-size="24" font-weight="700" fill="#101114">FROM HAEWON  /  PAPER RADAR 002</text><path d="M64 94 L1016 94" stroke="#10111433" stroke-width="2" fill="none"/><text x="64" y="1295" font-size="24" font-weight="600" fill="#101114">한해원의 관측소</text><text x="945" y="1295" font-size="24" font-weight="600" fill="#101114">4 / 5</text><text x="64" y="200" font-size="65" font-weight="900" fill="#101114">거짓 권한이 생기면,</text><text x="64" y="281.25" font-size="65" font-weight="900" fill="#101114">행동으로 이어졌다.</text><rect x="64" y="405" width="952" height="288" rx="24" fill="#FF613B"/><text x="96" y="460" font-size="29" font-weight="600" fill="#101114">최대</text><text x="96" y="602" font-size="140" font-weight="900" fill="#101114">50.2%</text><text x="96" y="653" font-size="30" font-weight="600" fill="#101114">무권한 요청 중 거짓 권한이 만들어진 비율</text><rect x="64" y="730" width="952" height="288" rx="24" fill="#101114"/><text x="96" y="911" font-size="140" font-weight="900" fill="#F7F8FA">98.6%</text><text x="96" y="971" font-size="30" font-weight="600" fill="#F7F8FA">거짓 권한이 이미 있을 때 무권한 행동을 실행</text><text x="64" y="1110" font-size="28" font-weight="500" fill="#101114">두 수치는 분모가 다릅니다.</text><text x="64" y="1154.8" font-size="28" font-weight="500" fill="#101114">논문의 벤치마크 조건에 한정되며 모델·기억 구성에 따라 다릅니다.</text></g></svg>