<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F0E8"/>
  <text x="78" y="92" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#1C2523">02 · 문제</text>
  <text x="78" y="245" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="64" font-weight="800" fill="#1C2523">
    <tspan x="78">기억은 정보를 줄일 때</tspan><tspan x="78" dy="90">권한의 경계까지</tspan><tspan x="78" dy="90">바꿀 수 있습니다.</tspan>
  </text>
  <rect x="78" y="565" width="924" height="390" rx="34" fill="#173C32"/>
  <text x="128" y="650" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700" fill="#E6B84A">예: 구매 권한의 변화</text>
  <text x="128" y="722" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="31" font-weight="800" fill="#F4F0E8">허용 → 범위 축소 → 철회</text>
  <path d="M144 810h720" stroke="#6F8A80" stroke-width="10" stroke-linecap="round"/>
  <circle cx="200" cy="810" r="24" fill="#E6B84A"/><circle cx="500" cy="810" r="24" fill="#F4F0E8"/><circle cx="820" cy="810" r="24" fill="#D94E36"/>
  <text x="128" y="895" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="27" fill="#F4F0E8">요약 메모가 철회를 놓치면, 과거 권한이 현재 권한처럼 남습니다.</text>
  <text x="78" y="1050" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="29" fill="#42504D">
    <tspan x="78">공격자가 없어도 에이전트 자신의 기억 갱신만으로</tspan><tspan x="78" dy="48">허용되지 않은 행동이 정상처럼 보일 수 있습니다.</tspan>
  </text>
  <text x="78" y="1262" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="24" fill="#65716E">한해원의 관측소</text>
  <text x="1002" y="1262" text-anchor="end" font-family="Arial, sans-serif" font-size="24" fill="#65716E">02 / 05</text>
</svg>
