<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F0E8"/>
  <text x="78" y="92" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#1C2523">05 · 결론</text>
  <text x="78" y="230" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="60" font-weight="800" fill="#1C2523">
    <tspan x="78">권한은 ‘기억’이 아니라</tspan><tspan x="78" dy="82">검증 가능한 원장에</tspan><tspan x="78" dy="82">남겨야 합니다.</tspan>
  </text>
  <rect x="78" y="500" width="924" height="300" rx="32" fill="#173C32"/>
  <text x="126" y="580" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="25" font-weight="700" fill="#E6B84A">RADAR의 해석</text>
  <text x="126" y="650" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="29" font-weight="800" fill="#F4F0E8"><tspan x="126">기억에는 출처와 유효기간을 붙이고,</tspan><tspan x="126" dy="50">실행 직전 권한은 별도 원장에서 다시 확인해야 합니다.</tspan></text>
  <text x="126" y="755" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#D8E0DA">논문의 두 방어법은 오류를 줄였지만 정상 요청 거부도 늘렸습니다.</text>
  <text x="78" y="858" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" font-size="23" fill="#65716E">※ 논문 본문·공식 저장소 기반 요약 · 논문 라이선스 CC BY 4.0</text>
