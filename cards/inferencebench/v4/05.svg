</defs><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F7F8FA"/><text x="64" y="65" font-size="24" font-weight="700" fill="#101114">FROM HAEWON  /  PAPER RADAR 003</text><path d="M64 94 L1016 94" stroke="#10111433" stroke-width="2" fill="none"/><text x="64" y="1295" font-size="24" font-weight="600" fill="#101114">한해원의 관측소</text><text x="945" y="1295" font-size="24" font-weight="600" fill="#101114">5 / 5</text><rect x="0" y="110" width="1080" height="300" rx="0" fill="#3455FF"/><text x="64" y="225" font-size="69" font-weight="900" fill="#F7F8FA">다른 가설 3개부터.</text><text x="64" y="330" font-size="29" font-weight="600" fill="#F7F8FA">관측소 적용 제안 · 논문 결과와 별개</text><text x="64" y="495" font-size="34" font-weight="600" fill="#101114">후보 전략을 세 가지 만들고 같은 예산으로 비교.</text><text x="64" y="549.4" font-size="34" font-weight="600" fill="#101114">가장 잘 작동한 설정을 저장한 뒤 재실행하세요.</text><text x="64" y="660" font-size="28" font-weight="500" fill="#101114">한계: 특정 모델·장비·시간 예산의 평가입니다.</text><text x="64" y="702" font-size="28" font-weight="500" fill="#101114">현재 모든 에이전트의 성능으로 일반화할 수 없습니다.</text><path d="M64 780 L1016 780" stroke="#BBB" stroke-width="3" fill="none"/><text x="64" y="837" font-size="29" font-weight="800" fill="#101114">InferenceBench: A Benchmark for Open-Ended</text><text x="64" y="873.25" font-size="29" font-weight="800" fill="#101114">LLM Inference Optimization by AI Agents</text><text x="64" y="939" font-size="25" font-weight="600" fill="#101114">Jehyeok Yeon · Ben Rank · Maksym Andriushchenko</text><text x="64" y="1010" font-size="25" font-weight="500" fill="#101114">https://arxiv.org/abs/2607.20468</text><text x="64" y="1047.5" font-size="25" font-weight="500" fill="#101114">본문 기반 요약 · 이번 재검수: §3–5 및 공식 저장소</text><text x="64" y="1170" font-size="23" font-weight="500" fill="#101114">© fromhaewon. All rights reserved.</text><text x="64" y="1204.5" font-size="23" font-weight="500" fill="#101114">직접 작성한 요약·디자인의 권리 표기입니다.</text></g></svg>