</defs><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F7F8FA"/><text x="64" y="65" font-size="24" font-weight="700" fill="#101114">FROM HAEWON  /  PAPER RADAR 003</text><path d="M64 94 L1016 94" stroke="#10111433" stroke-width="2" fill="none"/><text x="64" y="1295" font-size="24" font-weight="600" fill="#101114">한해원의 관측소</text><text x="945" y="1295" font-size="24" font-weight="600" fill="#101114">4 / 5</text><text x="64" y="210" font-size="71" font-weight="900" fill="#101114">아는 방법이 많아도,</text><text x="64" y="298.75" font-size="71" font-weight="900" fill="#101114">시험은 적었다.</text><text x="64" y="410" font-size="35" font-weight="600" fill="#101114">비기본 vLLM 설정 시도 수</text><text x="64" y="500" font-size="38" font-weight="600" fill="#3455FF">중앙값</text><text x="390" y="820" font-size="330" font-weight="900" fill="#3455FF">1</text><text x="640" y="800" font-size="75" font-weight="900" fill="#101114">개</text><text x="64" y="1010" font-size="35" font-weight="600" fill="#101114">2시간 실행에서 관측한 행동 분석</text><text x="64" y="1110" font-size="32" font-weight="500" fill="#101114">지식 부족보다 탐색·검증·최종 제출 과정이</text><text x="64" y="1158" font-size="32" font-weight="500" fill="#101114">병목일 수 있다는 것이 저자들의 해석입니다.</text></g></svg>