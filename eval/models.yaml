# M1 평가에 쓰는 로컬 모델 — **리비전 고정** (기획안 §9 재현성)
#
# 왜 리비전을 고정하는가 ★
# ------------------------
# 실제로 밟은 함정입니다. `SentenceTransformer("BAAI/bge-m3")` 를 그냥 호출했더니,
# sentence-transformers 5.x가 safetensors를 선호해서 **main이 아니라 머지되지 않은
# PR(`refs/pr/130`)에서 가중치를 받아갔습니다.** 캐시에 2.3GB가 중복으로 쌓였고,
# 더 중요하게는 **미머지 PR의 가중치로 평가가 돌 뻔했습니다.**
#
# PR은 닫히거나 바뀔 수 있습니다. 그 상태로 낸 Hit@5 수치는 3개월 뒤에 재현되지
# 않습니다. M1 수치가 이 프로젝트의 포트폴리오 가치 전부인데(기획안 §1) 재현이
# 안 되면 의미가 없습니다.
#
# → 아래 `revision` 을 명시적으로 넘기세요.
#     SentenceTransformer(repo, revision=rev, device=device)
#
# 라이선스는 전부 확인했습니다 (CLAUDE.md §3). 셋 다 재배포 가능한 허용적 라이선스이고,
# 어차피 가중치를 재배포하지 않습니다 — 로컬에서 추론만 합니다.

version: 1

embedder:
  id: bge_m3
  repo: "BAAI/bge-m3"
  revision: "5617a9f61b028005a4858fdac845db406aefb181"   # refs/main
  license: "MIT"
  dim: 1024
  # 실측 (2026-08-12, M4 Mac / torch 2.9.1 / threads=6)
  measured:
    cpu_sec_per_item: 0.255
    mps_sec_per_item: 0.094
    note: >-
      델타 §D6.3의 추정 "1건 약 0.2초, 1,000건 약 3~4분" 은 CPU 기준으로 정확했습니다
      (719건 3.1분). MPS는 2.7배 빠릅니다 (1.1분).

reranker:
  id: bge_reranker_v2_m3
  repo: "BAAI/bge-reranker-v2-m3"
  revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"   # refs/main
  license: "Apache-2.0"
  max_length: 512
  # ★ CrossEncoder 는 기본적으로 **sigmoid를 씌워서** 반환합니다.
  #   실측: 같은 5쌍에 대해 raw 로짓 -10.08 ~ -2.51 (표준편차 2.92)
  #                        sigmoid   0.0000 ~ 0.0751 (표준편차 0.029)
  #   순위는 단조변환이라 동일하지만, 무관한 쌍이 전부 0 근처로 뭉쳐서
  #   원장(`rank_score_stage2`)에 남겼을 때 사람이 읽을 수가 없습니다.
  #   임계값을 정할 때도 로짓이 훨씬 다루기 쉽습니다.
  #   → 평가·원장에는 **raw 로짓**을 쓰세요: CrossEncoder(..., activation_fn=torch.nn.Identity())
  use_raw_logits: true
  measured:
    cpu_sec_per_30_pairs: 31.5
    note: "기획안 §5의 '30쌍만 처리하므로 CPU로 1분 이내' 가정 확인됨"

# ── 선택 조건: 이미 캐시에 있어서 추가 다운로드 0 ─────────────────────────
# 기획안 §9의 비교 조건 "(선택) 임베딩 모델 교체" 를 공짜로 채울 수 있습니다.
# KURE-v1 은 한국어 특화 임베딩이고 `profile.papers_1.yaml` 의 관심사
# `multilingual_korean_retrieval` 이 바로 BidMate에서 이 모델을 쓴 경험에서 나왔습니다.
# 영어 초록에 한국어 특화 모델을 쓰면 어떻게 되는지가 교차언어 실험과 맞물립니다.
optional_embedders:
  - id: kure_v1
    repo: "nlpai-lab/KURE-v1"
    revision: "d14c8a9423946e268a0c9952fecf3a7aabd73bd9"   # refs/main
    license: "MIT"
    already_cached: true
    why: >-
      BidMate에서 쓴 한국어 특화 임베딩. 추가 다운로드 없이 기획안 §9의 5번째 비교
      조건이 됩니다. 영어 프로파일 / 한국어 프로파일 × bge-m3 / KURE-v1 의 2x2 가
      교차언어 손실을 더 정밀하게 분리합니다.

# ── 장치 선택 ────────────────────────────────────────────────────────────
# MPS(Apple GPU)와 CPU가 수치적으로 동일한 것을 확인했습니다.
#   코사인 유사도 최소 1.000000 / 최대 절대오차 5.22e-07 / top-5 순위 완전 일치
# 따라서 MPS를 써도 평가 결과가 달라지지 않습니다. 다만 **어느 장치로 돌렸는지는
# eval/results.md 에 기록**하세요. 재현할 사람이 같은 조건을 맞출 수 있어야 합니다.
device:
  preferred: "mps"
  fallback: "cpu"
  verified_equivalent: true
