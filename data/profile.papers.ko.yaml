# data/profile.papers.ko.yaml
# 논문 채널 관심사 프로파일 — 한국어판 (실험용, 운영에 쓰지 않음)
#
# [목적] 기획안 §7-(2)의 가정을 실측으로 검증하기 위한 대조군입니다.
#   가정: "한국어 프로파일로 영어 초록을 검색하면 랭킹 성능이 떨어진다"
#   검증: 같은 날 같은 후보군에 대해 profile.papers.yaml(영어)과 이 파일(한국어)로
#         각각 랭킹을 산출하고 Hit@5 / nDCG@10 / Kendall tau / top-5 겹침률을 비교
#
# [통제 조건] id·weight·순서·exclude를 영어판과 완전히 동일하게 유지합니다.
#   text만 번역했습니다. 그래야 차이의 원인을 언어로 귀속할 수 있습니다.
#   영어판을 수정하면 이 파일도 같이 수정하세요. 두 파일의 id 집합이 다르면
#   tests/test_profile_parity.py 가 실패합니다.
#
# [주의] 이 파일은 운영 파이프라인에 로드하지 않습니다.
#   eval/run_eval.py 에서만 참조합니다.

version: 1
channel: papers
visibility: public
language: ko
role: control_group          # ★ 운영용 아님
parity_with: "profile.papers.yaml"

interests:

  - id: identity_preserving_edit
    label: "제품·객체 동일성 보존 이미지 편집"
    weight: 1.0
    text: >
      확산 모델을 이용한 지시 기반 이미지 편집에서 특정 제품이나 객체의 동일성을
      편집 전후로 보존하는 문제. 주체 중심 생성, 참조 이미지 조건화, 전경 객체를
      픽셀 수준으로 유지한 채 배경을 교체하거나 조명을 다시 주는 기법. 마스킹과
      인페인팅 제어, 그리고 원본과 생성물 사이의 DINOv2·CLIP-I 유사도 같은
      정량적 동일성 지표.

  - id: text_rendering_cjk
    label: "생성 이미지 내 텍스트 렌더링 (CJK)"
    weight: 1.0
    text: >
      확산 모델이나 자기회귀 생성 모델이 만든 이미지 안에 읽을 수 있고 철자가
      정확한 텍스트를 렌더링하는 문제. 특히 한글·한자·일본어 같은 비라틴 문자를
      다룹니다. 글리프 수준 조건화, 타이포그래피를 고려한 레이아웃 생성, 생성된
      텍스트의 철자 정확도 벤치마크, 그리고 프로그램으로 조판한 글자를 생성된
      배경 위에 합성하는 하이브리드 접근.

  - id: judge_bias
    label: "LLM-as-a-Judge 신뢰성과 편향"
    weight: 1.0
    text: >
      대규모 언어모델을 자동 평가자로 쓸 때의 신뢰성. 심사 모델이 자기와 같은
      계열의 출력에 더 높은 점수를 주는 자기선호·동일가족 편향, 위치 편향과
      장황함 편향, 인간 선호 대비 심사 점수의 캘리브레이션, 그리고 생성자와
      검증자를 분리해 공통 약점을 물려받지 않게 하는 평가 프로토콜.

  - id: faithfulness_hallucination
    label: "요약 충실도·환각 탐지"
    weight: 1.0
    text: >
      생성된 요약과 원문 사이의 사실 일치도를 측정하고 환각을 탐지하는 문제.
      근거 지지도와 출처 귀속 점수화, 주장 단위 검증, 자연어 추론 기반 충실도
      지표, 근거 없는 주장의 식별, 그리고 임계값 미달 요약을 차단하거나
      재생성시키는 자동 게이트.

  - id: rag_retrieval_eval
    label: "RAG 검색 품질과 평가"
    weight: 1.0
    text: >
      검색 증강 생성 시스템의 검색 품질. 희소 BM25와 밀집 임베딩을 결합한
      하이브리드 검색, 상호 순위 융합, 교차 인코더 리랭킹, 청킹 전략이 검색에
      미치는 영향, 그리고 오픈 도메인 벤치마크가 아니라 도메인 특화 코퍼스에서
      Hit@k·MRR·nDCG로 리트리버를 평가하는 방법.

  - id: abstention_rejection
    label: "근거 없을 때 거절하는 능력"
    weight: 0.9
    text: >
      모델이 답을 하지 않기로 판단하는 능력의 학습과 측정. 답변 가능성 판별,
      검색된 문맥이 답을 뒷받침하지 않을 때의 거절, 신뢰도 추정에 기반한 선택적
      예측, 그리고 올바른 거절을 오답으로 감점하지 않고 보상하는 벤치마크.

  - id: multilingual_korean_retrieval
    label: "한국어·다국어 검색과 교차언어 정렬"
    weight: 0.9
    text: >
      검색을 위한 다국어 및 한국어 특화 텍스트 임베딩. 질의와 문서의 언어가
      다를 때의 교차언어 정렬 품질, 동일언어 검색 대비 교차언어 검색의 성능
      저하, 한국어 토크나이제이션과 형태론의 영향, 그리고 한국어 정보검색
      평가 자원.

  - id: query_routing
    label: "질의 유형별 라우팅·적응형 검색"
    weight: 0.9
    text: >
      질문의 유형에 따라 서로 다른 인덱스·청크 크기·파이프라인으로 질의를
      보내는 적응형 검색. 질의 분류, 애초에 검색이 필요한지의 판단, 다중 인덱스
      라우팅, 그리고 단일 검색 설정이 이질적인 질의 유형 전반에서 최적이 아님을
      보이는 분석.

  - id: tool_grounded_numeric
    label: "수치 계산을 코드에 위임하는 구조"
    weight: 0.9
    text: >
      언어모델이 직접 숫자를 만들게 하지 않고 결정적 코드나 구조화 API에 계산을
      위임해 수치·단위 오류를 막는 방법. 산술을 위한 도구 사용과 함수 호출,
      모델이 말한 수치를 구조화된 원천과 대조해 검증하기, 그리고 생성 텍스트의
      산술·단위 변환 오류율을 정량화한 연구.

  - id: efficient_inference
    label: "추론 경량화·로컬 서빙"
    weight: 0.8
    text: >
      언어모델과 확산 모델을 로컬에서 돌릴 만큼 저렴하게 만드는 문제. 양자화,
      증류, 가지치기, 약간의 품질을 내주고 큰 지연 이득을 얻는 소형 언어모델,
      vLLM 같은 서빙 스택에서의 배칭과 KV 캐시 전략, 그리고 품질만이 아니라
      지연과 메모리를 함께 보고하는 논문.

  - id: agent_orchestration
    label: "에이전트 오케스트레이션과 관측성"
    weight: 0.8
    text: >
      다단계 언어모델 파이프라인을 단일 프롬프트가 아니라 명시적 그래프나 상태
      기계로 오케스트레이션하는 방법. 단계별로 다른 모델을 배치하기, 단계 간
      실패 처리와 재시도 정책, LLM 애플리케이션의 추적과 관측성, 그리고 호출
      단위가 아니라 파이프라인 전체를 평가하는 방법.

  - id: data_aug_imbalance
    label: "데이터 증강과 클래스 불균형"
    weight: 0.8
    text: >
      롱테일 클래스 분포 아래에서의 객체 검출 데이터 증강. Copy-Paste 증강,
      희소 클래스에 대한 재샘플링과 재가중, 그리고 집계 지표만 보고하지 않고
      소수 클래스 성능이 오르는 대신 다수 클래스 성능이 내려가는 트레이드오프를
      함께 보고하는 연구.

  - id: doc_parsing
    label: "문서 파싱·표·수식 구조화 추출"
    weight: 0.8
    text: >
      실제 문서에서 구조화된 내용을 추출하는 문제. PDF 레이아웃 분석, 표 검출과
      표 구조 인식, 수식 추출, 읽기 순서 복원, 그리고 공시나 제안요청서 같은
      정제되지 않은 기관 문서로부터 도메인 코퍼스를 구축하는 작업.

  - id: gen_eval_metrics
    label: "생성 이미지 자동 평가 지표"
    weight: 0.6
    text: >
      생성 이미지의 자동 평가 지표와 인간 판단과의 상관. 지각적 유사도, 심미성
      예측기, 프롬프트-이미지 정렬 점수, 그리고 이 지표들이 인간 평가자와
      불일치하는 지점을 밝혀 회귀 감지 용도로만 써야 함을 보이는 비판적 연구.

  - id: image_restoration
    label: "이미지 복원·디노이징"
    weight: 0.6
    text: >
      파라미터 효율을 중시하는 이미지 복원과 디노이징. 더 적은 파라미터로
      경쟁력 있는 PSNR·SSIM에 도달하는 아키텍처, 합성 노이즈가 아닌 실제 노이즈
      벤치마크, 그리고 하위 인식 태스크의 전처리 단계로서의 복원.

exclude:
  soft:
    - text: "수렴 증명만 있고 실증 시스템이 없는 순수 이론 최적화"
      penalty: 0.8
    - text: "로보틱스 제어, 매니퓰레이션, 자율주행"
      penalty: 0.8
    - text: "계산생물학, 단백질 구조, 분자 물성 예측"
      penalty: 0.7
    - text: "양자 컴퓨팅"
      penalty: 0.9
    - text: "실험 없는 입장문 또는 논평"
      penalty: 0.5
    - text: "서베이"
      penalty: 0.3
